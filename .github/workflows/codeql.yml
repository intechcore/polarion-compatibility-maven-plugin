name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    # Monday morning, so a new query release is reported without waiting for a commit.
    - cron: "17 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: java-kotlin
          # src/it holds sample projects for the integration tests, not plugin code.
          config: |
            paths-ignore:
              - src/it

      # Only the classes are needed here. The tests run in ci.yml.
      - name: Build
        run: mvn -B clean compile

      - name: Analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:java-kotlin"
